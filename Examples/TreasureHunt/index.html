<!DOCTYPE html>
<html>
  <head>
    <title>Treasure hunt — swift-rpc</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A swift-rpc proof of concept: an Embedded Swift WebAssembly page calling a Swift distributed actor on AWS Lambda through a distributed protocol."
    />
    <meta name="theme-color" content="#f3ead3" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="swift-rpc" />
    <meta property="og:url" content="https://treasure-hunt.examples.elementary.codes/" />
    <meta property="og:title" content="Treasure hunt — swift-rpc" />
    <meta property="og:description" content="Embedded Swift in the browser, calling a Swift distributed actor on AWS Lambda. No schema, no codegen." />
    <meta property="og:image" content="https://treasure-hunt.examples.elementary.codes/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Treasure hunt: a grid of dug squares closing in on a gold star, next to the line try await hunt.dig(cell, in: game)." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    />
  </head>
  <body ontouchstart="">
    <script type="module">
      import "ElementaryFlow";
      import { init } from "virtual:swift-wasm?js&product=WebApp";
      // Fetch the fonts alongside the wasm instead of waiting for the first render to ask for them.
      const fonts = [
        "1em 'Archivo Black'",
        "500 1em 'Space Grotesk'",
        "700 1em 'Space Grotesk'",
        "500 1em 'JetBrains Mono'",
        "700 1em 'JetBrains Mono'",
        "800 1em 'JetBrains Mono'",
      ].map((font) => document.fonts.load(font));
      await Promise.all([init(), ...fonts]);
    </script>
  </body>
</html>
