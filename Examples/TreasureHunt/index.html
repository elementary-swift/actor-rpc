<!DOCTYPE html>
<html>
  <head>
    <title>Treasure hunt — swift-rpc</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A swift-rpc proof of concept: an Embedded Swift WebAssembly page calling a Swift distributed actor on AWS Lambda through a distributed protocol."
    />
    <meta name="theme-color" content="#f3ead3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    />
  </head>
  <body>
    <script type="module">
      import "ElementaryFlow";
      import { init } from "virtual:swift-wasm?js&product=WebApp";
      // Fetch the fonts alongside the wasm instead of waiting for the first render to ask for them.
      const fonts = [
        "1em 'Archivo Black'",
        "500 1em 'Space Grotesk'",
        "700 1em 'Space Grotesk'",
        "500 1em 'JetBrains Mono'",
        "700 1em 'JetBrains Mono'",
        "800 1em 'JetBrains Mono'",
      ].map((font) => document.fonts.load(font));
      await Promise.all([init(), ...fonts]);
    </script>
  </body>
</html>
