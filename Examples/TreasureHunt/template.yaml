AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Treasure hunt web app on CloudFront, calling a distributed actor on Lambda under /rpc.

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain for the site. Needs CertificateArn.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering DomainName. Empty serves the CloudFront domain only.
  PipelineRoleName:
    Type: String
    Default: ""
    Description: Role CI deploys with, allowed to upload the site and invalidate the cache. Empty for manual deploys.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  HasPipelineRole: !Not [!Equals [!Ref PipelineRoleName, ""]]

Resources:
  TreasureHuntFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elementary-treasure-hunt
      CodeUri: .build/lambda
      Handler: swift.bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          LOG_LEVEL: info
      Events:
        Rpc:
          Type: HttpApi
          Properties:
            ApiId: !Ref RpcApi
            Path: /rpc/{proxy+}
            Method: POST
            PayloadFormatVersion: "2.0"

  # Public demo: cap the request rate, which also caps the bill.
  RpcApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 50

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The page and /rpc share one origin, so the browser needs no CORS.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: rpc
            DomainName: !Sub "${RpcApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /rpc/*
            TargetOriginId: rpc
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader

  PipelineSitePolicy:
    Type: AWS::IAM::RolePolicy
    Condition: HasPipelineRole
    Properties:
      RoleName: !Ref PipelineRoleName
      PolicyName: !Sub "${AWS::StackName}-site-upload"
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${SiteBucket.Arn}/*"
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  Url:
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Description: Point the custom domain's CNAME here.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  SiteBucket:
    Value: !Ref SiteBucket
